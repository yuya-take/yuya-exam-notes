site_name: yuya-exam-notes
site_description: 資格試験の学習ノート
docs_dir: site_src # .claude/scripts/build_site.py が作る。直接編集しない
# nav は build_site.py が mkdocs.gen.yml に書く（README のチェックリストの順）。ビルドは mkdocs build -f mkdocs.gen.yml
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer # ページ下の「前へ」「次へ」
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

extra_css:
  - stylesheets/notes.css # site_assets/ から build_site.py が写す

plugins:
  - search:
      lang: ja

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.mark:
      smart_mark: false # 日本語の直後に == が来ても、マーカーとして読む
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
