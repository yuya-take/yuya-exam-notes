name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Claude 以外（スマホや手元の直接コミット）の変更も含めて検査する
      - name: 機微情報の検査
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..${SHA}"
          else
            RANGE="${BEFORE}..${SHA}"
          fi
          python3 .claude/hooks/secret_scan.py --range "$RANGE"

      - name: ノートのチェック
        run: python3 .claude/scripts/note_lint.py
